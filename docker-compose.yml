services:
  mirror-proxy:
    # 使用 GHCR 预构建镜像（推荐）
    # image: ghcr.io/arkylin/mirror-proxy:latest
    build: .
    container_name: mirror-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json
      - ./cache:/app/cache
    environment:
      - TZ=Asia/Shanghai
