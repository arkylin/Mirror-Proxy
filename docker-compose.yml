services:
  mirror-proxy:
    image: ghcr.io/arkylin/mirror-proxy:latest
    container_name: mirror-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./cache:/app/cache
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config/config.json
